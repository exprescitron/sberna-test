<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sberna</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
  :root {
    --text: #201f1e; --muted: #605e5c; --line: #e1dfdd;
    --ok: #107c10; --warn: #a4670a; --err: #a4262c; --accent: #0f6cbd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 12px;
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--text); background: #fff;
  }
  h1 { margin: 0 0 10px; font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .kontext {
    font-size: 11px; padding: 4px 8px; border-radius: 3px;
    margin-bottom: 10px; display: inline-block;
  }
  .kontext.sdilena { background: #dff6dd; color: var(--ok); }
  .kontext.vlastni { background: #fff4ce; color: var(--warn); }
  .kontext.neznama { background: #fde7e9; color: var(--err); }

  dl { margin: 0 0 12px; display: grid; grid-template-columns: 74px 1fr; gap: 3px 8px; }
  dt { color: var(--muted); font-size: 11px; }
  dd { margin: 0; font-size: 12px; word-break: break-word; }

  .ident {
    border: 1px solid var(--line); border-radius: 4px;
    padding: 8px 10px; margin-bottom: 12px; background: #faf9f8;
  }
  .ident .popisek { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .ident .kod {
    font: 600 16px/1.2 "Cascadia Mono", Consolas, monospace;
    letter-spacing: .04em; user-select: all;
  }

  button {
    font: inherit; border-radius: 4px; cursor: pointer;
    padding: 9px 14px; border: 1px solid transparent;
  }
  button:disabled { cursor: default; opacity: .5; }
  .hlavni { background: var(--accent); color: #fff; width: 100%; font-weight: 600; }
  .hlavni:hover:not(:disabled) { background: #115ea3; }
  .vedlejsi {
    background: #fff; border-color: #8a8886; color: var(--text);
    font-size: 12px; padding: 5px 10px; margin-top: 8px;
  }

  #vysledek { margin-top: 12px; font-size: 12px; }
  .radek { padding: 3px 0; }
  .radek.ok::before    { content: "✓ "; color: var(--ok); font-weight: 700; }
  .radek.info::before  { content: "· "; color: var(--muted); }
  .radek.chyba::before { content: "✕ "; color: var(--err); font-weight: 700; }
  .radek.chyba { color: var(--err); }

  details { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
  summary { font-size: 11px; color: var(--muted); cursor: pointer; }
  pre {
    font: 11px/1.4 "Cascadia Mono", Consolas, monospace;
    white-space: pre-wrap; word-break: break-all;
    background: #faf9f8; padding: 8px; border-radius: 3px; margin: 8px 0 0;
  }
</style>
</head>
<body>

<h1>SBĚRNA</h1>
<div id="kontext" class="kontext neznama">zjišťuji…</div>

<dl>
  <dt>Předmět</dt><dd id="predmet">—</dd>
  <dt>Od</dt><dd id="od">—</dd>
  <dt>Přijato</dt><dd id="prijato">—</dd>
</dl>

<div class="ident">
  <div class="popisek">Identifikátor poptávky</div>
  <div class="kod" id="ident">—</div>
</div>

<button id="oznacit" class="hlavni" disabled>Označit jako zpracováno</button>
<button id="kopirovat" class="vedlejsi">Zkopírovat identifikátor a údaje</button>

<div id="vysledek"></div>

<details>
  <summary>Diagnostika</summary>
  <pre id="diag">—</pre>
</details>

<script>
// ---------------------------------------------------------------- nastaveni
// Nazev kategorie musi presne sedet na podminku ve flow Power Automate.
var KATEGORIE = "Zpracováno";
// Barva kategorie. Presety 0-24, mapovani na konkretni barvy neni v dokumentaci
// jednoznacne - barvu lze kdykoli prenastavit primo v Outlooku (pravy klik na
// kategorii -> zmenit barvu). Tohle je jen barva pri prvnim zalozeni.
var BARVA = "Preset0";

var stav = {};          // co se povedlo zjistit, vypisuje se v Diagnostice
var identifikator = "";

// -------------------------------------------------- kratky identifikator
// FNV-1a 32bit nad internetMessageId. Deterministicky: ze stejneho mailu
// vyjde vzdy stejny kod, takze se da kdykoli dopocitat znovu a nemusi se
// nikam ukladat.
function zkratka(messageId) {
  var h = 0x811c9dc5;
  for (var i = 0; i < messageId.length; i++) {
    h ^= messageId.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return ("00000" + h.toString(36).toUpperCase()).slice(-5);
}

function vytvorIdentifikator(messageId, datum) {
  var d = datum instanceof Date && !isNaN(datum) ? datum : new Date();
  var rok = String(d.getFullYear()).slice(-2);
  var mes = ("0" + (d.getMonth() + 1)).slice(-2);
  return "JX-" + rok + mes + "-" + zkratka(messageId || "bez-id");
}

// ---------------------------------------------------------------- pomocne
function $(id) { return document.getElementById(id); }

function zapis(trida, text) {
  var d = document.createElement("div");
  d.className = "radek " + trida;
  d.textContent = text;
  $("vysledek").appendChild(d);
}

function diag() {
  var r = [];
  for (var k in stav) r.push(k + " = " + stav[k]);
  $("diag").textContent = r.join("\n") || "—";
}

function podporovano(sada) {
  try { return Office.context.requirements.isSetSupported("Mailbox", sada); }
  catch (e) { return false; }
}

// ---------------------------------------------------------------- start
Office.onReady(function () {
  var item = Office.context.mailbox.item;

  stav["hostName"] = Office.context.diagnostics ? Office.context.diagnostics.hostName : "?";
  stav["Mailbox 1.8 (kategorie)"] = podporovano("1.8") ? "ano" : "NE";
  stav["Mailbox 1.13"] = podporovano("1.13") ? "ano" : "NE";

  $("predmet").textContent = item.subject || "(bez předmětu)";
  $("od").textContent = item.from
    ? (item.from.displayName || "") + " <" + item.from.emailAddress + ">"
    : "—";
  var prijato = item.dateTimeCreated;
  $("prijato").textContent = prijato ? new Date(prijato).toLocaleString("cs-CZ") : "—";

  stav["internetMessageId"] = item.internetMessageId || "(nedostupne)";
  stav["conversationId"] = item.conversationId || "(nedostupne)";

  identifikator = vytvorIdentifikator(item.internetMessageId, prijato ? new Date(prijato) : null);
  $("ident").textContent = identifikator;
  stav["identifikator"] = identifikator;

  zjistiKontext();

  if (!podporovano("1.8")) {
    $("kontext").className = "kontext neznama";
    $("kontext").textContent = "tento Outlook neumí kategorie (chybí Mailbox 1.8)";
    zapis("chyba", "Označení tady nepůjde. Nahlas to prosím i s obsahem Diagnostiky.");
  } else {
    $("oznacit").disabled = false;
  }

  diag();
});

// ------------------------------------------- sdilena vs vlastni schranka
// getSharedPropertiesAsync projde jen nad polozkou ve sdilene slozce nebo
// schrance. Kdyz neprojde, jsme ve vlastni poste. Overeno testem 15. 9. 2026.
function zjistiKontext() {
  var el = $("kontext");
  var item = Office.context.mailbox.item;

  if (typeof item.getSharedPropertiesAsync !== "function") {
    el.className = "kontext vlastni";
    el.textContent = "vlastní schránka";
    stav["sdilena schranka"] = "getSharedPropertiesAsync neexistuje";
    return;
  }

  try {
    item.getSharedPropertiesAsync(function (v) {
      if (v.status === Office.AsyncResultStatus.Succeeded && v.value) {
        el.className = "kontext sdilena";
        el.textContent = "sdílená schránka " + v.value.targetMailbox;
        stav["sdilena schranka"] = v.value.targetMailbox;
        stav["delegatePermissions"] = v.value.delegatePermissions;
      } else {
        el.className = "kontext vlastni";
        el.textContent = "vlastní schránka";
        stav["sdilena schranka"] = "ne";
      }
      diag();
    });
  } catch (e) {
    el.className = "kontext vlastni";
    el.textContent = "vlastní schránka";
    stav["sdilena schranka"] = "vyjimka: " + e.message;
  }
}

// ---------------------------------------------------------------- oznaceni
$("oznacit").addEventListener("click", function () {
  $("oznacit").disabled = true;
  $("vysledek").innerHTML = "";
  zajistiKategoriiVSeznamu(pridejKategoriiNaZpravu);
});

// Kategorie musi nejdriv existovat v hlavnim seznamu schranky, jinak ji
// nektere klienty na zpravu nepridaji. U sdilene schranky se tohle chova
// nespolehlive, proto se pripadna chyba jen zaznamena a pokracuje se dal.
function zajistiKategoriiVSeznamu(hotovo) {
  if (!Office.context.mailbox.masterCategories) {
    stav["masterCategories"] = "nedostupne";
    zapis("info", "Hlavní seznam kategorií není dostupný, zkouším přidat rovnou.");
    return hotovo();
  }

  Office.context.mailbox.masterCategories.getAsync(function (v) {
    if (v.status !== Office.AsyncResultStatus.Succeeded) {
      stav["masterCategories.getAsync"] = v.error ? v.error.message : "selhalo";
      zapis("info", "Seznam kategorií se nepodařilo načíst, zkouším přidat rovnou.");
      return hotovo();
    }

    var existuje = (v.value || []).some(function (k) { return k.displayName === KATEGORIE; });
    stav["kategorie v seznamu"] = existuje ? "ano" : "ne, zakladam";
    if (existuje) return hotovo();

    Office.context.mailbox.masterCategories.addAsync(
      [{ displayName: KATEGORIE, color: Office.MailboxEnums.CategoryColor[BARVA] }],
      function (v2) {
        if (v2.status === Office.AsyncResultStatus.Succeeded) {
          zapis("ok", "Kategorie „" + KATEGORIE + "“ založena v seznamu schránky.");
        } else {
          stav["masterCategories.addAsync"] = v2.error ? v2.error.message : "selhalo";
          zapis("info", "Kategorii se nepodařilo založit, zkouším přidat rovnou.");
        }
        hotovo();
      }
    );
  });
}

function pridejKategoriiNaZpravu() {
  Office.context.mailbox.item.categories.addAsync([KATEGORIE], function (v) {
    if (v.status === Office.AsyncResultStatus.Succeeded) {
      zapis("ok", "Označeno „" + KATEGORIE + "“ v " + new Date().toLocaleTimeString("cs-CZ") + ".");
      zapis("info", "Přesun do složky provede Power Automate, obvykle do pěti minut.");
      zapis("info", "Identifikátor: " + identifikator);
      stav["vysledek"] = "OK";
    } else {
      $("oznacit").disabled = false;
      var m = v.error ? v.error.message : "neznámá chyba";
      zapis("chyba", "Označení selhalo: " + m);
      zapis("info", "Otevři Diagnostiku, zkopíruj obsah a pošli ho.");
      stav["vysledek"] = "CHYBA: " + m;
    }
    diag();
  });
}

// ---------------------------------------------------------------- kopie
$("kopirovat").addEventListener("click", function () {
  var t = [
    "Identifikátor: " + identifikator,
    "Předmět: " + $("predmet").textContent,
    "Od: " + $("od").textContent,
    "Přijato: " + $("prijato").textContent,
    "Message-ID: " + (stav["internetMessageId"] || "")
  ].join("\n");

  var ta = document.createElement("textarea");
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); zapis("ok", "Zkopírováno do schránky."); }
  catch (e) { zapis("chyba", "Kopírování selhalo, označ text ručně."); }
  document.body.removeChild(ta);
});
</script>

</body>
</html>
